<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Formulário - Carro Elétrico</title>

                <link rel="stylesheet" href="style.css">
                </head>

                <body>

                    <div class="container">
                            <h1>🚗 Formulário sobre Carros Elétricos</h1>

                                    <p class="descricao">
                                                Responda às perguntas abaixo sobre carros elétricos.
                                                        </p>

                                                                <form id="formulario">

                                                                            <label for="nome">Nome:</label>
                                                                                        <input type="text" id="nome" placeholder="Digite seu nome" required>

                                                                                                    <label for="idade">Idade:</label>
                                                                                                                <input type="number" id="idade" placeholder="Digite sua idade" required>

                                                                                                                            <label>Você já dirigiu um carro elétrico?</label>

                                                                                                                                        <div class="opcoes">
                                                                                                                                                        <label>
                                                                                                                                                                            <input type="radio" name="dirigiu" value="Sim" required>
                                                                                                                                                                                                Sim
                                                                                                                                                                                                                </label>

                                                                                                                                                                                                                                <label>
                                                                                                                                                                                                                                                    <input type="radio" name="dirigiu" value="Não">
                                                                                                                                                                                                                                                                        Não
                                                                                                                                                                                                                                                                                        </label>
                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                <label for="interesse">
                                                                                                                                                                                                                                                                                                                                Você teria interesse em comprar um carro elétrico?
                                                                                                                                                                                                                                                                                                                                            </label>

                                                                                                                                                                                                                                                                                                                                                        <select id="interesse" required>
                                                                                                                                                                                                                                                                                                                                                                        <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                                        <option value="Sim">Sim</option>
                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Talvez">Talvez</option>
                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Não">Não</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="motivo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                Qual seria o principal motivo para comprar um carro elétrico?
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <select id="motivo" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="">Selecione</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Economia">Economia de combustível</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Meio ambiente">Preservação do meio ambiente</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Tecnologia">Tecnologia</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Desempenho">Desempenho</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <option value="Outro">Outro</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                O que você acha da autonomia dos carros elétricos?
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="opcoes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="radio" name="autonomia" value="Boa" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Boa
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="radio" name="autonomia" value="Regular">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        Regular
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </label>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="radio" name="autonomia" value="Ruim">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                Ruim
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="opiniao">Deixe sua opinião sobre carros elétricos:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <textarea id="opiniao" rows="5"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    placeholder="Digite sua opinião..." required></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button type="submit">Enviar formulário</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="resultado"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
